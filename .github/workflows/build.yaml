
name: Build Workflow

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.config }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - Debug
          - RelWithDebInfo

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1.12.1
        with:
          arch: amd64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B "${{ github.workspace }}/build" `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DCMAKE_CI_BUILD=ON `
            "-DGITHUB_ENV=$env:GITHUB_ENV" `
            -G Ninja

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed."
          }

      - name: Build
        id: build
        shell: pwsh
        run: |
          cmake --build "${{ github.workspace }}/build" `
            --config "${{ matrix.config }}" `
            --parallel

          if ($LASTEXITCODE -ne 0) {
            throw "Build failed."
          }

      - name: Set artifact names
        shell: pwsh
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)

          if ("${{ matrix.config }}" -eq "RelWithDebInfo") {
            $prettyConfig = "release"
          } else {
            $prettyConfig = "${{ matrix.config }}".ToLower()
          }

          "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV
          "PRETTY_CONFIG=$prettyConfig" >> $env:GITHUB_ENV

      - name: Verify packaged output
        shell: pwsh
        run: |
          $gameDir = Join-Path "${{ github.workspace }}" "game_dir"
          $debugDir = Join-Path "${{ github.workspace }}" "game_dir_debug"

          if (-not (Test-Path $gameDir -PathType Container)) {
            throw "CMake did not generate game_dir. Check the build output and CMake packaging configuration."
          }

          $releaseFiles = Get-ChildItem $gameDir -File -Recurse -ErrorAction SilentlyContinue

          if (-not $releaseFiles) {
            throw "game_dir exists but contains no files."
          }

          Write-Host "Release package contents:"
          $releaseFiles | Select-Object -ExpandProperty FullName

          if (Test-Path $debugDir -PathType Container) {
            Write-Host "Debug-symbol output detected."
            Get-ChildItem $debugDir -File -Recurse |
              Select-Object -ExpandProperty FullName
          } else {
            Write-Host "game_dir_debug was not generated; the PDB artifact will be skipped."
          }

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_ZIP_FILENAME }}_${{ env.PRETTY_CONFIG }}_${{ env.SHORT_SHA }}
          path: game_dir/**
          if-no-files-found: error
          compression-level: 6

      - name: Upload debug symbols
        if: hashFiles('game_dir_debug/**/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MOD_ZIP_FILENAME }}_${{ env.PRETTY_CONFIG }}_${{ env.SHORT_SHA }}_pdb
          path: game_dir_debug/**
          if-no-files-found: error
          compression-level: 6

      - name: Create version badge
        if: always()
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GAME_VERSION: ${{ env.CYBERPUNK_2077_GAME_VERSION }}
        run: |
          New-Item -ItemType Directory -Path badge -Force | Out-Null

          $color = if ($env:BUILD_OUTCOME -eq "success") {
            "31b75d"
          } else {
            "red"
          }

          $badge = @{
            cp_version = @{
              label = "Cyberpunk 2077"
              status = if ($env:GAME_VERSION) { $env:GAME_VERSION } else { "build failed" }
              color = $color
            }
          } | ConvertTo-Json -Depth 4 -Compress

          Set-Content -Path "badge/shields.json" -Value $badge -Encoding utf8

      - name: Publish version badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: s0/git-publish-subdir-action@develop
        env:
          REPO: self
          BRANCH: shields
          FOLDER: badge
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
